<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АйРус — панель заказов</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="wrap dashboard-row">
      <div class="brand">АйРус CRM</div>
      <div class="toolbar">
        <input id="searchInput" class="search" placeholder="Поиск по имени, телефону, ЖК">
        <button id="logoutBtn" class="btn btn-ghost">Выйти</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="filter-row">
      <button class="chip active" data-filter="all">Все</button>
      <button class="chip" data-filter="Новая">Новые</button>
      <button class="chip" data-filter="В работе">В работе</button>
      <button class="chip" data-filter="Выполнена">Выполненные</button>
    </div>

    <section class="stats" id="stats"></section>

    <h2 style="margin:26px 0 16px; font-size:34px;">Список заказов</h2>
    <section id="ordersList" class="orders-grid"></section>
  </main>

  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
