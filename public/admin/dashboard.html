<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АйРус — иерархическая админка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-container admin-header-inner">
      <a class="brand-mark" href="/"> <span>Ай</span>Rus </a>

      <nav class="admin-nav">
        <a href="/">Сайт</a>
        <a href="/admin/dashboard.html" class="is-active">Панель заказов</a>
      </nav>

      <div class="admin-tools">
        <label class="search-shell">
          <span class="search-icon">⌕</span>
          <input id="searchInput" class="search-input" placeholder="Поиск по имени, телефону, ЖК, адресу">
        </label>
        <button id="logoutBtn" class="mini-icon-btn" title="Выйти">↪</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-hero admin-container">
      <div class="status-tabs" id="statusTabs"></div>

      <div class="panel-head">
        <div class="crumbs" id="breadcrumbs"></div>
        <label class="toggle-shell" id="showAllWrap" hidden>
          <input type="checkbox" id="showAllAddresses">
          <span class="toggle-ui"></span>
          <span>Показать все адреса</span>
        </label>
      </div>

      <div class="dashboard-layout">
        <section class="dashboard-panel content-panel">
          <div class="section-title-row">
            <h1 id="panelTitle">Загрузка...</h1>
            <div class="section-meta" id="panelMeta"></div>
          </div>
          <div id="panelContent"></div>
        </section>

        <aside class="dashboard-panel side-panel">
          <div class="section-title-row side-title-row">
            <h2>Сводка</h2>
          </div>
          <div class="stats-grid" id="statsGrid"></div>
          <div class="side-actions">
            <button id="resetViewBtn" class="action-btn ghost">Сбросить фильтры</button>
            <a class="action-btn accent" href="/">Открыть сайт</a>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
