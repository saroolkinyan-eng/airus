<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АйРус — вход в админку</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>АйРус Админ</h1>
    <p>Войдите в рабочую панель заказов. После входа будут доступны новые заявки, статусы и управление заказами.</p>
    <form id="loginForm">
      <div class="field">
        <label for="login">Логин</label>
        <input id="login" value="sarosaasa" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" value="rozamimoza123" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;">Войти в панель</button>
      <div id="loginError" class="login-hint"></div>
      <div class="login-hint">Тестовый вход уже подставлен: <strong>sarosaasa / rozamimoza123</strong></div>
    </form>
  </div>
  <script src="../js/admin-login.js"></script>
</body>
</html>
